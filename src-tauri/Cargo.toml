[package]
name = "op-time-tracker"
version = "2.1.0"
description = "OpenProject Time Tracker — Tauri desktop app"
authors = ["Tam Mai <tam.mai@bigin.vn>"]
edition = "2021"
rust-version = "1.77"

[lib]
# The Tauri mobile/desktop convention: all app code lives in the lib so it can
# be exercised by `cargo test` (and by a mobile entry point) while `main.rs`
# stays a two-line shim.
name = "op_time_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The native file picker and save dialog. Only its **Rust** API is used: the
# frontend is not granted the plugin's JS permission, so a path is never chosen
# by, or handed to, the webview. See `commands::attachments`.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
base64 = "0.22"
regex = "1"
once_cell = "1"

# Native TLS rather than rustls: the app talks to whatever OpenProject the user
# runs, including instances behind a corporate CA that is trusted by the OS
# store but absent from webpki-roots.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "multipart", "native-tls"]

[dependencies.tokio]
version = "1"
features = ["fs", "macros", "rt-multi-thread", "sync", "time"]

# The API key at rest. `keyring` puts it in the OS keychain (DPAPI-backed
# Credential Manager on Windows, Keychain on macOS, Secret Service on Linux) —
# the same guarantee Electron's `safeStorage` gave.
[dependencies.keyring]
version = "3"
features = ["apple-native", "windows-native", "sync-secret-service"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
# `custom-protocol` is what `tauri build` passes; keeping it declared means a
# release build does not warn about an unknown feature.
custom-protocol = ["tauri/custom-protocol"]
