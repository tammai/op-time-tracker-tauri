# Quality gate for both halves of the app: the Rust backend and the webview.
#
# Rust runs first and on Linux only — the backend has no platform-specific code
# and `cargo test` is the cheapest signal in the pipeline, so a broken schema or
# payload builder fails in under a minute rather than after a full app build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs its system libraries even to *check* the crate: `tauri` links
      # against webkit2gtk and libsoup, so `cargo test` fails at build time
      # without them even though no test opens a window.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  webview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches engines.node and release.yml.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # `components.d.ts` and `auto-imports.d.ts` are generated by the `ui()`
      # Vite plugin and gitignored, so a fresh clone has neither and every Nuxt
      # UI component resolves as untyped. Without building first, a template
      # expression whose type comes from a component — a slot prop, an event
      # handler's parameter — is an implicit `any` here and nowhere else, which
      # is a failure only CI can see. Building also means CI covers the frontend
      # build, which is otherwise never exercised.
      - name: Build the frontend (generates the component type declarations)
        run: pnpm build:vite

      - run: pnpm type-check
      - run: pnpm test
